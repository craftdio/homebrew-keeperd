name: Update KeepERD Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: KeepERD release version without the leading v (for example, 0.1.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require the maintainer to start or re-run this workflow
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [ "$ACTOR" != EunjinWoo ] || [ "$TRIGGERING_ACTOR" != EunjinWoo ]; then
            echo '::error::Only EunjinWoo may run or re-run the Formula updater.'
            exit 1
          fi

  update:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: update-keeperd-formula
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Verify the release and update the Formula
        id: formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/update-formula.sh "$VERSION"
          if git diff --quiet -- Formula/keeperd.rb; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "Formula is already at v$VERSION; no pull request is needed."
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Open a Formula update pull request
        if: steps.formula.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="formula/keeperd-v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add Formula/keeperd.rb
          git commit -m "chore: Update KeepERD Formula to v$VERSION"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update KeepERD Formula to v$VERSION" \
            --body "$(printf '%s\n' \
              "- Update the Homebrew Formula to the published KeepERD v$VERSION release." \
              '- Verify the downloaded archive against its published SHA-256 checksum before changing the Formula.' \
              '- Require a separate review and merge; this workflow does not publish or merge the change.')"
