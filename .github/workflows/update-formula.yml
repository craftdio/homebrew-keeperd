name: Update KeepERD Formula

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: KeepERD release version without the leading v (for example, 0.1.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require the maintainer to start or re-run this workflow
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$ACTOR" != EunjinWoo ] || [ "$TRIGGERING_ACTOR" != EunjinWoo ]; then
            echo '::error::Only EunjinWoo may run or re-run the Formula updater.'
            exit 1
          fi
          if [ "${EVENT_NAME}" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            echo '::error::Run the Formula updater from the main branch only.'
            exit 1
          fi

  validate:
    needs: authorize
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Test release checksum and runtime validation
        run: ./scripts/test-update-formula.sh

      - name: Verify the release and prepare the Formula
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(ruby -e 'puts File.read("Formula/keeperd.rb").match(%r{^  url "https://github.com/craftdio/keeperd/releases/download/v([^/]+)/})[1]')
          fi
          ./scripts/update-formula.sh "$VERSION"

      - name: Install and test the Formula on macOS
        env:
          HOMEBREW_DEVELOPER: '1'
        run: |
          brew install --formula ./Formula/keeperd.rb
          brew test ./Formula/keeperd.rb

      - uses: actions/upload-artifact@v4
        with:
          name: validated-formula-${{ matrix.os }}
          path: Formula/keeperd.rb
          if-no-files-found: error
          retention-days: 1

  update:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-keeperd-formula
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: validated-formula-macos-latest
          path: Formula

      - name: Push the validated Formula to a version branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git diff --quiet -- Formula/keeperd.rb; then
            echo "Formula is already at v$VERSION; no branch update is needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="formula/keeperd-v$VERSION"
          remote_branch=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$remote_branch" ]; then
            git fetch --no-tags origin "$branch"
            if git diff --quiet HEAD FETCH_HEAD -- . ':(exclude)Formula/keeperd.rb' &&
               git show FETCH_HEAD:Formula/keeperd.rb | cmp -s - Formula/keeperd.rb; then
              echo "Validated Formula already exists on branch \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::Branch $branch already exists with different content; review it manually."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add Formula/keeperd.rb
          git commit -m "chore: Update KeepERD Formula to v$VERSION"
          git push origin "$branch"
          echo "Validated Formula pushed to branch \`$branch\`. Review it before merging into main." >> "$GITHUB_STEP_SUMMARY"
